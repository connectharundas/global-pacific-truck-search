<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Pacific Truck Search System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container-fluid p-4">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">

                🚛 Global Pacific Truck Search System

            </h2>

        </div>

        <div class="card-body">

            <!-- SEARCH -->

            <div class="row mb-4">

                <div class="col-md-9">

                    <input
                        type="text"
                        id="searchBox"
                        class="form-control form-control-lg"
                        placeholder="Search Truck No / Trailer No / Transportor">

                </div>

                <div class="col-md-3">

                    <button
                        id="downloadBtn"
                        class="btn btn-success btn-lg w-100">

                        Download Result

                    </button>

                </div>

            </div>

            <!-- SUMMARY -->

            <div class="row mb-3">

                <div class="col-md-6">

                    <h5>

                        Total Records :

                        <span id="totalRecords">

                            {{ total_records }}

                        </span>

                    </h5>

                </div>

                <div class="col-md-6 text-end">

                    <h5>

                        Results Found :

                        <span id="resultCount">

                            0

                        </span>

                    </h5>

                </div>

            </div>

            <!-- TABLE -->

            <div class="table-responsive table-container">
                <table class="table table-bordered table-hover align-middle" id="resultTable">

                    <thead class="table-dark">

                    <tr>

                        {% for column in columns %}

                        <th>

                            {{ column }}

                        </th>

                        {% endfor %}

                    </tr>

                    </thead>

                    <tbody id="tableBody">

                        <tr>

                            <td colspan="{{ columns|length }}" class="text-center">

                                Search Truck Number...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
