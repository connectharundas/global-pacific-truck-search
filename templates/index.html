<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Pacific Truck Search</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="bg-decor" aria-hidden="true"></div>

<div class="app">

    <!-- HEADER -->
    <header class="app-header">
        <div class="app-header-row">
            <div class="app-header-icon">🚛</div>
            <div class="app-header-text">
                <h1>Global Pacific Truck Search</h1>
                <p>MV- MANTA ZUHAL - DUQAM - JEBAL ALI</p>
            </div>
        </div>

        <div class="stat-chips">
            <div class="stat-chip">
                <span class="stat-chip-value" id="totalRecords">{{ total_records }}</span>
                <span class="stat-chip-label">Total Records</span>
            </div>
            <div class="stat-chip stat-chip-accent">
                <span class="stat-chip-value" id="resultCount">0</span>
                <span class="stat-chip-label">Results Found</span>
            </div>
        </div>
    </header>

    <main class="app-body">

        <div class="sticky-toolbar">

            <!-- SEARCH + DOWNLOAD -->
            <div class="toolbar">
                <div class="search-box">
                    <span class="search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="searchBox"
                        placeholder="Search truck no, trailer no...">
                    <button id="searchClearBtn" class="search-clear" type="button" aria-label="Clear search">&times;</button>
                </div>

                <button id="downloadBtn" class="download-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Download Result
                </button>
            </div>

            <!-- DOWNLOAD BY LOADED DATE -->
            <div class="loaded-download">
                <div class="loaded-download-label">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>Download by Loaded Date</span>
                </div>
                <div class="loaded-download-controls">
                    <input type="date" id="loadedDateInput">
                    <button id="loadedDownloadBtn">Download</button>
                </div>
            </div>

            <!-- FILTER DROPDOWN -->
            <div class="filter-dropdown" id="filterDropdown">
                <button type="button" class="filter-dropdown-toggle" id="filterDropdownToggle">
                    <span class="filter-dropdown-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span id="filterDropdownLabel">All</span>
                    <svg class="filter-dropdown-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="filter-dropdown-menu" id="filterDropdownMenu">
                    {% for tab in status_tabs %}
                    <button
                        type="button"
                        class="filter-option {% if loop.first %}active{% endif %}"
                        data-status="{{ tab }}">
                        {{ tab }}
                    </button>
                    {% endfor %}
                </div>
            </div>

        </div>

        <!-- RESULTS -->
        <div id="resultList" class="result-list">
            <div class="empty-state">Loading records...</div>
        </div>

    </main>

</div>

<!-- SCROLL TO TOP -->
<button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>

<!-- DRILL-DOWN MODAL -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-sheet">
        <div class="modal-header">
            <h2>Record Details</h2>
            <button id="detailModalClose" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div id="detailModalBody" class="modal-body"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
