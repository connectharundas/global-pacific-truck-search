<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Pacific Truck Search</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="app-header">
        <div class="app-header-icon">🚛</div>
        <div class="app-header-text">
            <h1>Global Pacific Truck Search</h1>
            <p>Live fleet &amp; shipment tracking</p>
        </div>
    </header>

    <main class="app-body">

        <!-- SEARCH -->
        <div class="search-row">
            <div class="search-box">
                <span class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search truck no, trailer no, transporter...">
            </div>
        </div>

        <!-- DOWNLOAD -->
        <button id="downloadBtn" class="download-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Download Result
        </button>

        <!-- SUMMARY -->
        <div class="summary-row">
            <div>Total Records: <span id="totalRecords">{{ total_records }}</span></div>
            <div>Results Found: <span id="resultCount">0</span></div>
        </div>

        <!-- FILTER TABS -->
        <div class="tabs-row" id="statusTabs">
            {% for tab in status_tabs %}
            <button
                class="tab-btn {% if loop.first %}active{% endif %}"
                data-status="{{ tab }}">
                {{ tab }}
            </button>
            {% endfor %}
        </div>

        <!-- RESULTS -->
        <div id="resultList" class="result-list">
            <div class="empty-state">Loading records...</div>
        </div>

    </main>

</div>

<!-- DRILL-DOWN MODAL -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-sheet">
        <div class="modal-header">
            <h2>Record Details</h2>
            <button id="detailModalClose" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div id="detailModalBody" class="modal-body"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
