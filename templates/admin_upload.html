<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Data — Global Pacific Truck Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="bg-decor" aria-hidden="true"></div>
<div class="admin-wrap">
    <h1>Upload Data</h1>

    <div class="admin-meta">Current records in database: {{ total_records }}</div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="admin-flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">
        <label for="file">Excel file (.xlsx)</label>
        <input type="file" id="file" name="file" accept=".xlsx" required>
        <button type="submit">Upload &amp; replace all records</button>
    </form>

    <div class="admin-links">
        <a href="{{ url_for('admin_logout') }}">Log out</a>
    </div>
</div>
</body>
</html>
